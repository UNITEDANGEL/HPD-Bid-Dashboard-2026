<svg width="1280" height="2380" viewBox="0 0 1280 2380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Improved iPhone dark glass map and job card designs</title>
  <desc id="desc">Four improved iPhone-style dark glass map and bottom job-card designs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#061410"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.52" stop-color="#0f2639"/>
      <stop offset="1" stop-color="#061722"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18293d" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#0d1b2b" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#060d16" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132235" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#08131f" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4e96ff" flood-opacity="0.72"/>
    </filter>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#64f0a1" flood-opacity="0.7"/>
    </filter>
    <style>
      .page-title { font: 800 42px Inter, Arial, sans-serif; fill:#f5f9ff; letter-spacing:0; }
      .page-sub { font: 500 22px Inter, Arial, sans-serif; fill:#9fb0c6; letter-spacing:0; }
      .sample-title { font: 800 28px Inter, Arial, sans-serif; fill:#f3f8ff; letter-spacing:0; }
      .sample-sub { font: 500 16px Inter, Arial, sans-serif; fill:#92a5bc; letter-spacing:0; }
      .phone { fill:#040810; stroke:#33475c; stroke-width:3; }
      .map { fill:url(#map); }
      .road { fill:none; stroke:#6a8197; stroke-width:3; opacity:.25; }
      .road2 { fill:none; stroke:#49637b; stroke-width:2.2; opacity:.32; }
      .route { fill:none; stroke:#5b9dff; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; filter:url(#blueGlow); }
      .routeAlt { fill:none; stroke:#66f2a3; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:14 14; filter:url(#greenGlow); }
      .pin { fill:#2f86ff; stroke:#9dccff; stroke-width:4; filter:url(#blueGlow); }
      .dot { fill:#65ee9b; stroke:#e9fff1; stroke-width:4; filter:url(#greenGlow); }
      .sheet { fill:url(#sheet); stroke:#435c75; stroke-width:2.4; filter:url(#softShadow); }
      .glass { fill:#0c1725; fill-opacity:.83; stroke:#354d64; stroke-width:2; }
      .glassBlue { fill:#0d2342; fill-opacity:.78; stroke:#4592ff; stroke-width:2.4; }
      .glassGreen { fill:#0d3026; fill-opacity:.78; stroke:#68f2a4; stroke-width:2.4; }
      .glassAmber { fill:#382814; fill-opacity:.82; stroke:#ffc157; stroke-width:2.2; }
      .glassRed { fill:#3a1820; fill-opacity:.82; stroke:#ff6b67; stroke-width:2.2; }
      .handle { fill:#93a9bd; opacity:.9; }
      .job { font: 800 28px Inter, Arial, sans-serif; fill:#f5f9ff; letter-spacing:0; }
      .muted { font: 600 15px Inter, Arial, sans-serif; fill:#91a5bd; letter-spacing:0; }
      .label { font: 800 18px Inter, Arial, sans-serif; fill:#65a5ff; letter-spacing:0; }
      .body { font: 600 16px Inter, Arial, sans-serif; fill:#d7e4f4; letter-spacing:0; }
      .small { font: 600 13px Inter, Arial, sans-serif; fill:#b7c6d8; letter-spacing:0; }
      .tiny { font: 700 11px Inter, Arial, sans-serif; fill:#95a8bf; letter-spacing:0; }
      .button { font: 800 16px Inter, Arial, sans-serif; letter-spacing:0; }
      .buttonSmall { font: 800 13px Inter, Arial, sans-serif; letter-spacing:0; }
      .blue { fill:#5b9dff; }
      .green { fill:#66f2a3; }
      .amber { fill:#ffc057; }
      .red { fill:#ff6b67; }
      .white { fill:#eef5ff; }
      .lineBlue { fill:none; stroke:#5b9dff; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .lineGreen { fill:none; stroke:#66f2a3; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .lineAmber { fill:none; stroke:#ffc057; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .lineRed { fill:none; stroke:#ff6b67; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .lineWhite { fill:none; stroke:#c4d2e4; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1280" height="2380" fill="url(#bg)"/>
  <text x="64" y="72" class="page-title">Better iPhone Dark-Glass Samples</text>
  <text x="64" y="112" class="page-sub">Same style, cleaner spacing, real map on top, real bottom sheet target.</text>

  <!-- shared phone symbol snippets are expanded per sample -->

