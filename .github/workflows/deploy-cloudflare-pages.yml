name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  # The fetcher's data commits are pushed by GitHub Actions, which doesn't start this workflow
  # on its own: deploy when a fetcher run finishes so new jobs and documents go live right away.
  workflow_run:
    workflows: ["Run Built-In Fetcher"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  # A running deploy finishes (the fetcher pushes every ~10 minutes and a deploy with all its tests takes
  # longer, so cancelling would never let one finish); newer pushes wait, and only the newest waiting runs.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      # Tests open the encrypted tenant data / invitation PDFs the way the signed-in route does.
      HPD_PRIVATE_DATA_KEY: ${{ secrets.HPD_PRIVATE_DATA_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
      # Google Maps key (Street View Static API) for the automatic building picture on job cards.
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}

    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID. Add both as GitHub Actions repository secrets to enable Pages deploys."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Latest main, including the data the fetcher just committed.
          ref: main
          # History, so the build can tell a code change from a data-only change (the app reloads only for code).
          fetch-depth: 300

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test maturity date priorities
        run: npm run test:job-priority

      - name: Test field workflow guidance
        run: npm run test:field-flow

      - name: Test saved status import
        run: npm run test:saved-statuses

      - name: Test job queues and individual map pins
        run: |
          node scripts/test-job-queues.cjs
          node scripts/test-map-pins.cjs
          node scripts/test-field-ticket.cjs
          node scripts/test-appointments.cjs
          node scripts/test-day-route.cjs
          node scripts/test-current-job.cjs
          node scripts/test-planner-location.cjs
          node scripts/test-building-photo.cjs
          node scripts/test-saved-package.cjs
          node scripts/test-complete-package.cjs
          node scripts/test-video-choice.cjs
          node scripts/test-planner-constraints.cjs
          node scripts/test-field-assistant.cjs
          node scripts/test-package-readiness.cjs
          node scripts/test-driving-link.cjs
          node scripts/test-drive-auth.mjs
          node scripts/test-drive-backups.mjs
          node scripts/test-drive-full-backup.mjs
          node scripts/test-drive-videos.mjs
          node scripts/test-phone-storage.mjs
          node scripts/test-free-space.mjs
          node scripts/test-rollout.mjs
          node scripts/test-next-job.mjs
          node scripts/test-drive-sync.mjs
          node scripts/test-email-package.cjs
          node scripts/test-appointment-calendar.mjs
          node scripts/test-day-summary.mjs

      - name: Test paperwork, packages, sync and stats
        run: |
          node scripts/test-invoice-amounts.cjs
          node scripts/test-invoice-pdf.cjs
          node scripts/test-no-access-rules.cjs
          node scripts/test-description-quality.cjs
          node scripts/test-visit-record.cjs
          node scripts/test-package-delivery.cjs
          node scripts/test-drive-packages.mjs
          node scripts/test-override-sync.cjs
          node scripts/test-private-sync-schema.cjs
          node scripts/test-import-fetched-jobs.cjs
          node scripts/test-planner-dictation.cjs
          node scripts/test-field-stats.cjs
          node scripts/test-job-location.cjs
          node scripts/test-tenant-contact-clean.cjs
          node scripts/test-road-route.cjs
          node scripts/test-daily-report.mjs
          python3 scripts/test-upcoming-bids.py
          python3 scripts/test-bid-fax-watch.py
          node scripts/test-bid-price.cjs
          node scripts/test-bid-rounds.mjs
          node scripts/test-bid-packages.mjs
          node scripts/test-market-awards.mjs
          node scripts/test-bid-stats.mjs
          node scripts/test-job-followup.mjs
          node scripts/test-paperwork-lock.mjs
          node scripts/test-paperwork-check.mjs
          node scripts/test-job-stages.mjs
          node scripts/test-job-summary.mjs
          node scripts/test-auto-fix.mjs
          node scripts/test-bid-calc.mjs
          node scripts/test-costs.mjs
          node scripts/test-priorities.mjs
          node scripts/test-notice-board.mjs
          node scripts/test-push.mjs
          node scripts/test-old-job-dates.mjs
          node scripts/test-ai-draft.mjs
          node scripts/test-payment-track.mjs
          node scripts/test-correction-copy.mjs
          node scripts/test-notice-findings.mjs
          node scripts/test-job-icon.mjs
          node scripts/test-auto-resend.mjs
          node scripts/test-building-facts.mjs
          node scripts/test-building-bids.mjs
          node scripts/test-private-data.mjs
          node scripts/test-bid-checklist.mjs
          node scripts/test-privatize.mjs
          node scripts/test-master-file.mjs
          node scripts/test-bid-fax-server.mjs
          node cloudflare-timer/test-timer.mjs
          node cloudflare-worker/test-sync.mjs

      - name: Build Cloudflare Pages output
        run: npm run build:cloudflare

      # Drive the built paperwork page in a real browser before it goes live: signed and print
      # packages, notary date, watermark. Google and the live status server are answered by the
      # test itself, so nothing is uploaded, emailed or written to real jobs.
      - name: Install browser for paperwork test
        run: npx playwright install --with-deps chromium

      - name: Test paperwork, stats and route in a browser
        run: |
          python3 -m http.server 3000 --directory out > /tmp/static-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/paperwork/ > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3000 node scripts/test-browser-paperwork.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-affidavit-flow.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-stats.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-route.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-next-stop.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-route-progress.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bids.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bid-sync.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-building-facts.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-update-recovery.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-correction.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-landscape.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-checklist.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-privacy.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-notice-view.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bid-pages.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-price-check.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-flow.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-my-price.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-all-buttons.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-buttons-visible.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bids-panel.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-no-bid.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-conversations.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-autofix.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-calculator.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-costs.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bids-badge.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-prefill.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-priorities.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-notice-depts.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-priority-map.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-notice-board.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-scan.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bid-icons.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-auto-resend.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-vt-send.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-money.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-fix-queue.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-nudge.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-no-flash.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-page-zoom.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-sent-pdf.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-ring.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-old-dates.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-push.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-deeplink.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-faxtrack.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-jobs.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-bidbar.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-find.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-missed.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-no-418.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-no-dupes.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-arrive.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-agent.mjs
