          BASE_URL=http://localhost:3000 node scripts/test-browser-followup.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-paperwork-lock.mjs
          BASE_URL=http://localhost:3000 node scripts/test-browser-two-tap.mjs

      - name: Resolve Cloudflare production branch
        id: pages-project
        shell: bash
        run: |
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hpd-bid-dashboard-2026")"

          production_branch="$(printf '%s' "$response" | node -e "const fs = require('fs'); const body = JSON.parse(fs.readFileSync(0, 'utf8')); if (!body.success) { console.error(JSON.stringify(body.errors)); process.exit(1); } console.log(body.result.production_branch || 'main');")"
          echo "production_branch=$production_branch" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages production branch: $production_branch"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=hpd-bid-dashboard-2026 --branch=${{ steps.pages-project.outputs.production_branch }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # "Deployment complete" isn't proof: check the live address really serves this build, and fail
      # loudly if it doesn't (a preview-only deploy once reported success for a day).
      - name: Verify the live address serves this build
        shell: bash
        run: |
          want="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("out/version.json","utf8")).commit)')"
          for i in $(seq 1 18); do
            got="$(curl -fsS -m 20 "https://hpd-bid-dashboard-2026.pages.dev/version.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit)}catch{console.log("?")}})' || echo "?")"
            echo "live: $got  want: $want"
            if [ "$got" = "$want" ]; then
              echo "Live address is serving $want."
              # The "Add to Calendar" server function must answer with a calendar entry.
              cal="$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{content_type}' "https://hpd-bid-dashboard-2026.pages.dev/api/appointment-calendar?id=TEST-0001&address=Test&date=2099-01-05&start=10:00&end=11:00&state=confirmed&contact=Tenant&reminder=60")"
              echo "calendar function: $cal"
              case "$cal" in "200 text/calendar"*) exit 0 ;; *) echo "::error::The Add to Calendar function did not answer with a calendar entry ($cal)."; exit 1 ;; esac
            fi
            sleep 10
          done
          echo "::error::The live address still serves $got, not $want. The deploy did not go live (check the Cloudflare Pages project: production branch and automatic Git builds)."
          exit 1
