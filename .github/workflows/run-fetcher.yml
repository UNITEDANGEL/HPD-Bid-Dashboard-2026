name: Run Built-In Fetcher

on:
  schedule:
    # Runs every 24 hours at 6:00 AM New York time during daylight savings.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days back to fetch"
        required: false
        default: "14"

permissions:
  contents: write
  deployments: write

concurrency:
  group: hpd-built-in-fetcher
  cancel-in-progress: false

jobs:
  run-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Restore Google credentials if secrets exist
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          fi

          if [ -n "${{ secrets.GOOGLE_TOKEN_JSON }}" ]; then
            printf '%s' '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json
          fi

          test -s credentials.json || (echo "Missing GOOGLE_CREDENTIALS_JSON repository secret." && exit 1)
          test -s token.json || (echo "Missing GOOGLE_TOKEN_JSON repository secret." && exit 1)

      - name: Run safe fetcher update
        env:
          FETCHER_LOOKBACK_DAYS: ${{ inputs.days_back || vars.FETCHER_AUTO_DAYS || '14' }}
        run: node scripts/run-safe-fetcher-update.js

      - name: Check fetcher health
        run: node scripts/check-fetcher-health.js

      - name: Sync public data
        run: |
          cp data/COA_Fetcher_2026.json public/data/COA_Fetcher_2026.json
          cp data/fetcher_latest_status.json public/data/fetcher_latest_status.json
          cp data/fetcher_latest_run.log public/data/fetcher_latest_run.log
          if [ -f data/paperwork_data_quality.json ]; then
            cp data/paperwork_data_quality.json public/data/paperwork_data_quality.json
          fi
          if [ -f data/missing_itb_jobs_2026.csv ]; then
            cp data/missing_itb_jobs_2026.csv public/data/missing_itb_jobs_2026.csv
          fi

      - name: Build dashboard
        run: npm run build

      - name: Commit fetcher output
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/COA_Fetcher_2026.json data/fetcher_latest_status.json data/fetcher_latest_run.log public/data/COA_Fetcher_2026.json public/data/fetcher_latest_status.json public/data/fetcher_latest_run.log

          if [ -f data/paperwork_data_quality.json ]; then
            git add data/paperwork_data_quality.json public/data/paperwork_data_quality.json
          fi

          if [ -f data/missing_itb_jobs_2026.csv ]; then
            git add data/missing_itb_jobs_2026.csv public/data/missing_itb_jobs_2026.csv
          fi

          if git diff --cached --quiet; then
            echo "No fetcher data changes to commit."
          else
            git commit -m "Run built-in fetcher from GitHub Action"
            git push origin main
          fi

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID. Add both as GitHub Actions repository secrets so daily fetcher runs can update Cloudflare Pages."
            exit 1
          fi

      - name: Build Cloudflare Pages output
        run: npm run build:cloudflare

      - name: Resolve Cloudflare production branch
        id: pages-project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hpd-bid-dashboard-2026")"

          production_branch="$(printf '%s' "$response" | node -e "const fs = require('fs'); const body = JSON.parse(fs.readFileSync(0, 'utf8')); if (!body.success) { console.error(JSON.stringify(body.errors)); process.exit(1); } console.log(body.result.production_branch || 'main');")"
          echo "production_branch=$production_branch" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages production branch: $production_branch"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=hpd-bid-dashboard-2026 --branch=${{ steps.pages-project.outputs.production_branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}


