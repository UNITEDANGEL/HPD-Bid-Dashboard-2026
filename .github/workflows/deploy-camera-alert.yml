name: Deploy Camera Alert (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'camera-alert/**'
      - '.github/workflows/deploy-camera-alert.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: camera-alert-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: node camera-alert/test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: camera-alert
      - id: deployment
        uses: actions/deploy-pages@v4
