name: Check live version

# Shows which version the live address serves and how Cloudflare Pages filed the latest deploys
# (live "production" or "preview"), using the CLOUDFLARE_* secrets. Prints no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Live address
        shell: bash
        run: |
          for url in https://hpd-bid-dashboard-2026.pages.dev/version.json https://main.hpd-bid-dashboard-2026.pages.dev/version.json https://render-map-upgrade.hpd-bid-dashboard-2026.pages.dev/version.json; do
            echo "== $url"; curl -s -m 20 "$url?t=$(date +%s)"; echo
          done
      - name: Cloudflare project and latest deployments
        shell: bash
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hpd-bid-dashboard-2026"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e '
            const b = JSON.parse(require("fs").readFileSync(0, "utf8")).result || {};
            console.log("production_branch:", b.production_branch);
            console.log("source:", JSON.stringify(b.source || null));
            console.log("domains:", (b.domains || []).join(", "));
            const c = b.canonical_deployment || {};
            console.log("canonical (live) deployment:", c.id, c.environment, c.deployment_trigger && c.deployment_trigger.metadata && c.deployment_trigger.metadata.branch, c.created_on);
            const l = b.latest_deployment || {};
            console.log("latest deployment:", l.id, l.environment, l.deployment_trigger && l.deployment_trigger.metadata && l.deployment_trigger.metadata.branch, l.created_on);'
          echo "== latest deployments"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments?per_page=12" | node -e '
            const rows = JSON.parse(require("fs").readFileSync(0, "utf8")).result || [];
            for (const d of rows) {
              const m = (d.deployment_trigger && d.deployment_trigger.metadata) || {};
              console.log([d.created_on, d.environment, "branch=" + m.branch, "commit=" + String(m.commit_hash || "").slice(0, 7), "aliases=" + (d.aliases || []).join(" "), d.url].join(" | "));
            }'
