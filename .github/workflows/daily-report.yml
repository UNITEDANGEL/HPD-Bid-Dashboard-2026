name: Daily Report Email

# Every evening: today's visits, outcomes and money, close-outs and tomorrow, emailed to the account
# that ran scripts/authorize-daily-report.mjs. 23:30 UTC = 7:30 PM New York (6:30 PM in winter).
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the report
        run: node scripts/test-daily-report.mjs

      - name: Build and email today's report
        env:
          DAILY_REPORT_GOOGLE_TOKEN: ${{ secrets.DAILY_REPORT_GOOGLE_TOKEN }}
        run: node scripts/daily-report.mjs --send
