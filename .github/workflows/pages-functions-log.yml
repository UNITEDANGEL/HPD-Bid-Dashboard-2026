name: Pages Functions Log

# Watches the live site's server functions (/api/...) for 8 minutes and prints each request's errors.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    steps:
      - name: Watch /api requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/hpd-bid-dashboard-2026/deployments?env=production&per_page=1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result[0].id))')
          echo "deployment $id"
          timeout 480 npx -y wrangler@4 pages deployment tail "$id" --project-name hpd-bid-dashboard-2026 --format pretty || true
