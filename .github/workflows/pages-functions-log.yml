name: Pages Functions Log

# Watches the live site's server functions (/api/...) for 8 minutes and prints each request's errors.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    steps:
      - name: Watch /api requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 480 npx -y wrangler@4 pages deployment tail --project-name hpd-bid-dashboard-2026 --environment production --format pretty || true
