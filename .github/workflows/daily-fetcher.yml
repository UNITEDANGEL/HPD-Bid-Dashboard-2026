name: Daily Fetcher Run

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render fetcher
        run: |
          curl -sS -X POST "https://hpd-bid-dashboard-2026.onrender.com/api/fetcher/run" \
            -H "x-fetcher-secret: ${{ secrets.FETCHER_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail