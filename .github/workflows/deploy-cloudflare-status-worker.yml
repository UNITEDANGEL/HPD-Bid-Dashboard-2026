name: Deploy Cloudflare Status Worker

on:
  push:
    branches:
      - map-preview
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-status-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install current Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-save wrangler@4.110.0

      - name: Deploy status and sync Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
