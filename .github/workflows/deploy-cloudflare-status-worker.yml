name: Deploy Cloudflare Status Worker

# The status server every phone syncs job steps through (hpd-status-worker). Deploys only when run
# by hand (Actions > Deploy Cloudflare Status Worker > Run workflow), from main, after its tests.
# Note (2026-10-12): the live server is older than cloudflare-worker/src: it has no /sync, so the
# phones' cloud sync of field records is still off. The first deploy from here turns that on for
# every phone - decide that on purpose, not as a side effect.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the status server
        run: |
          node cloudflare-worker/test-sync.mjs
          node scripts/test-override-sync.cjs

      - name: Deploy status and sync Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
